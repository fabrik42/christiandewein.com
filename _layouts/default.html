<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {% if page.title %}<title>{{ page.title }} by {{ site.title }}</title>
    {% else %}<title>{{ site.title }}</title>{% endif %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="christian, dewein, baeuerlein, bäuerlein, bauerlein, fabrik42, frankfurt, ruby, ioki">
    <link rel="preload" href="/assets/fonts/InstrumentSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/assets/fonts/InstrumentSerif-Italic.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/assets/css/styles.css">

    {% seo title=false %}
    {% feed_meta %}
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
  </head>
  <body>
    <div class="site">
      <header class="site-header">
        <a class="wordmark" href="/">Christian Dewein</a>
        <nav class="site-nav">
          {% assign n = page.name %}
          <a href="/"{% if n == 'index.html' %} class="is-active"{% endif %}>About</a>
          <a href="/now"{% if page.url == '/now' %} class="is-active"{% endif %}>Now</a>
          <a href="/projects"{% if n == 'projects.html' %} class="is-active"{% endif %}>Projects</a>
          <a href="/talks"{% if n == 'talks.html' %} class="is-active"{% endif %}>Talks</a>
          <a href="/podcasts"{% if n == 'podcasts.html' %} class="is-active"{% endif %}>Podcasts</a>
          <a href="/articles"{% if n == 'articles.html' %} class="is-active"{% endif %}>Articles</a>
        </nav>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <a href="/imprint">Imprint</a>
        <span>•</span>
        <a href="/feed.xml">RSS Feed</a>
      </footer>
    </div>
  </body>
</html>
