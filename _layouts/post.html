---
layout: default
---
<article class="page post">
  {{ content }}
  {% if page.show_modified %}
  <div class="post-date">Last updated {{ page.last_modified_at | date_to_long_string: "ordinal", "US" }}</div>
  {% else %}
  <div class="post-date">Published {{ page.date | date_to_long_string: "ordinal", "US" }}</div>
  {% endif %}
</article>
